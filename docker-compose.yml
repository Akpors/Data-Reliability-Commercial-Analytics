name: drct

x-airflow-common: &airflow-common
  image: drct-airflow:${AIRFLOW_VERSION}
  working_dir: /opt/drct
  environment: &airflow-env
    PYTHONPATH: /opt/drct/src
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    # Ingestion is event-driven: DAGs must be live as soon as they are parsed.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
    DBT_BIN: /opt/dbt-venv/bin/dbt
    WAREHOUSE_HOST: ${WAREHOUSE_HOST}
    WAREHOUSE_PORT: ${WAREHOUSE_PORT}
    WAREHOUSE_USER: ${WAREHOUSE_USER}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
    WAREHOUSE_DB: ${WAREHOUSE_DB}
    WAREHOUSE_DSN: ${WAREHOUSE_DSN}
    LANDING_DIR: ${LANDING_DIR}
    DRCT_SEED: ${DRCT_SEED}
    FX_SOURCE: ${FX_SOURCE}
    FX_API_URL: ${FX_API_URL}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./src:/opt/drct/src
    - ./tests:/opt/drct/tests
    - ./dbt:/opt/drct/dbt
    - ./landing:/opt/drct/landing
    - ./pyproject.toml:/opt/drct/pyproject.toml:ro
  depends_on: &airflow-depends-on
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  # Every published port is bound to 127.0.0.1 only: Airflow runs with no login (all admins) and the
  # warehouse user is a superuser with a placeholder password, so neither may be reachable from the LAN.
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
      CONTROL_TOWER_RO_PASSWORD: ${CONTROL_TOWER_RO_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${WAREHOUSE_USER} -d ${WAREHOUSE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    profiles: ["tools"]
    image: drct-app
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /opt/drct
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/drct/src
      WAREHOUSE_HOST: ${WAREHOUSE_HOST}
      WAREHOUSE_PORT: ${WAREHOUSE_PORT}
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      WAREHOUSE_DSN: ${WAREHOUSE_DSN}
      TEST_ADMIN_DSN: ${TEST_ADMIN_DSN}
      CONTROL_TOWER_DSN: ${CONTROL_TOWER_DSN}
      LANDING_DIR: ${LANDING_DIR}
      DRCT_SEED: ${DRCT_SEED}
      FX_SOURCE: ${FX_SOURCE}
      FX_API_URL: ${FX_API_URL}
    volumes:
      - ./src:/opt/drct/src
      - ./tests:/opt/drct/tests
      - ./dbt:/opt/drct/dbt
      - ./landing:/opt/drct/landing
      - ./warehouse/init:/opt/drct/warehouse/init:ro
      - ./pyproject.toml:/opt/drct/pyproject.toml:ro

  control-tower:
    image: drct-app
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /opt/drct
    command:
      - streamlit
      - run
      - src/drct/control_tower/app.py
      - --server.port
      - "8501"
      - --server.address
      - 0.0.0.0
      - --server.headless
      - "true"
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/drct/src
      CONTROL_TOWER_DSN: ${CONTROL_TOWER_DSN}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./src:/opt/drct/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
    command: ["airflow", "db", "migrate"]
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: ["airflow", "api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: *airflow-depends-on
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]
    depends_on: *airflow-depends-on
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

  airflow-dag-processor:
    <<: *airflow-common
    command: ["airflow", "dag-processor"]
    depends_on: *airflow-depends-on
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

  airflow-triggerer:
    <<: *airflow-common
    command: ["airflow", "triggerer"]
    depends_on: *airflow-depends-on
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --local"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

volumes:
  warehouse_data:
  airflow_db:
  airflow_logs:
