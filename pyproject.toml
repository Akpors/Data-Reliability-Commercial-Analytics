[project]
name = "drct"
version = "0.1.0"
description = "Data Reliability Control Tower"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs Postgres"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
